<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wahidiya">
<meta name="theme-color" content="#14401f">
<title>Wahidiya Press – ভাঁজ হিসাব</title>
<style>
:root{--side:#14401f;--side2:#1d5a2c;--g:#1f7a43;--o:#f26a2e;--r:#e0303f;--y:#f0b429;--ink:#17301f;--mut:#667068;--line:#e3e8e2;--bg:#f4f6f3;--card:#fff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{-webkit-tap-highlight-color:transparent;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali","Nirmala UI",sans-serif;font-size:15px}
.app{display:flex;min-height:100vh}
aside.side{width:230px;background:var(--side);color:#e8f2ea;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{background:#fff;color:var(--side);margin:14px;border-radius:12px;padding:16px 10px;text-align:center}
.brand .lg{width:52px;height:52px;border-radius:50%;background:var(--side);color:#f0d878;font:800 28px/52px Georgia,serif;margin:0 auto 6px}
.brand b{display:block;font-size:17px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:#e8f2ea;font:inherit;padding:13px 18px;cursor:pointer}
nav button.on{background:var(--side2);border-left-color:var(--o);font-weight:700}
nav button:hover{background:#19502a}
nav button .ic{display:inline-block;width:28px}nav button .sh2{display:none}
main{flex:1;min-width:0;padding:22px 24px 50px;max-width:1100px}
h1{font-size:24px;font-weight:500;margin:0;color:#33433a}
h2{font-size:17px;margin:0 0 12px}
h2.sec{margin:22px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.row{display:grid;gap:14px;margin-bottom:14px}.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border-radius:10px;padding:16px 18px;box-shadow:0 2px 8px #0b2a1612;border-top:4px solid var(--g)}
.card.o{border-top-color:var(--o)}.card.y{border-top-color:var(--y)}.card.d{border-top-color:var(--side)}
.card .l{color:var(--mut);font-size:14px}.card .v{font-size:26px;font-weight:800;margin:4px 0 0;color:var(--side);overflow-wrap:anywhere}.card.o .v{color:var(--o)}
.plain{border-top:0;margin-bottom:14px}
.wlayout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:16px;align-items:start}
.fg{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0b2a1612;margin-bottom:14px}
.fh{margin:0 0 14px;font-size:15px;color:var(--g);display:flex;align-items:center;gap:8px}.fh::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--o)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:5px}.f.full{grid-column:1/-1}
label{font-weight:700;font-size:15px}.hint{font-weight:400;font-size:12.5px;color:var(--mut)}
input,select{width:100%;border:1.5px solid #cfd8d0;border-radius:10px;padding:11px 12px;min-height:48px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid #bfe3c6;border-color:var(--g)}
.big-in{font-size:24px!important;font-weight:800;min-height:60px!important}
.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--g);color:#fff}
.btn.sec{background:#fff;color:var(--side);border:1px solid #c5d1c6}.btn.dg{background:#fff0ef;color:var(--r)}.btn.sm{padding:7px 11px;font-size:13px}.btn.or{background:var(--o)}
.big-btn{padding:14px 26px;font-size:16px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.st{min-height:22px;margin-top:10px;color:var(--g);font-size:14px}.st.err{color:var(--r)}
.wside{position:sticky;top:16px;background:var(--side);color:#e8f2ea;border-radius:14px;padding:20px}
.wside .sl{font-size:13px;color:#a9c9b1}.wside .sa{font-size:36px;font-weight:800;color:#f0d878;margin:2px 0 12px}
.sr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #ffffff22;font-size:15px}.sr span{color:#a9c9b1}.sr b{text-align:right}
.wside .btn{width:100%;margin-top:6px}
.entry{border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;background:#fff}
.entry h3{margin:0 0 3px;font-size:16px}.meta{color:var(--mut);font-size:13.5px;line-height:1.6}.bill{color:var(--g);font-weight:700}
.er{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.en{text-align:right;display:flex;flex-direction:column;flex-shrink:0}.en b{font-size:17px}
.entry .acts{margin-top:9px;gap:7px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;margin-left:6px}
.b-g{background:#e2f3e7;color:#17612f}.b-o{background:#fff0e3;color:#b4520f}.b-r{background:#fde8ea;color:#a8202c}.b-m{background:#eceeec;color:#555}
table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;font-size:14px}th{background:#eef3ee}
td.n,th.n{text-align:right}.scroll{overflow-x:auto}.tot td{font-weight:800;background:#f4f8f4}tr.sub td{background:#f7faf7;font-weight:700}tr.d1 td{border-top:2px solid #9db8a2}td small{color:var(--mut)}
.set{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.empty{color:var(--mut);text-align:center;padding:18px}
.tools{display:flex;gap:10px;flex-wrap:wrap}.tools input{width:auto;min-width:170px}
#printReport{display:none}
#printReport h1{text-align:center;color:var(--side);font-weight:800;margin:0}.ph{text-align:center;border-bottom:2px solid var(--side);padding-bottom:12px;margin-bottom:14px}.ph p{margin:4px 0 0;color:var(--mut)}
.sign{display:flex;justify-content:space-between;margin-top:54px}.sign div{width:42%;border-top:1px solid #777;padding-top:6px;text-align:center;font-size:13px}
.lo{background:none;border:1px solid #c5d1c6;border-radius:8px;padding:5px 12px;font:inherit;font-size:12.5px;color:var(--side);cursor:pointer;margin-top:8px}
#syncTxt{display:block;font-size:12px;color:var(--mut)}#syncTxt.ok{color:var(--g)}#syncTxt.busy{color:#b4520f}#syncTxt.err{color:var(--r);font-weight:700}
#boot,#login{position:fixed;inset:0;z-index:200;background:var(--side);display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;text-align:center;font-size:17px}
#login form{background:#fff;color:var(--ink);border-radius:16px;padding:26px 22px;width:100%;max-width:360px;display:grid;gap:12px}
#login h2{margin:0;font-size:20px}#login p{margin:0;color:var(--mut);font-size:14px}
.lg2{width:60px;height:60px;border-radius:50%;background:var(--side);color:#f0d878;font:800 32px/60px Georgia,serif;margin:0 auto}
#imgBox{position:fixed;inset:0;z-index:300;background:#000b;display:flex;align-items:center;justify-content:center;padding:14px}
.ibox{background:#fff;border-radius:14px;padding:14px;max-width:560px;width:100%;max-height:100%;overflow:auto}
.ibox img{width:100%;display:block;border-radius:8px;border:1px solid var(--line)}.ibox .acts{margin-top:12px}.ibox .btn{flex:1 1 130px}
@media(max-width:860px){
 .app{display:block}
 aside.side{width:auto;height:auto;position:sticky;top:0;z-index:40;overflow:visible}
 .brand{display:flex;align-items:center;gap:10px;text-align:left;margin:0;border-radius:0;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--side);color:#fff}
 .brand .lg{margin:0;width:36px;height:36px;font:800 20px/36px Georgia,serif;background:#f0d878;color:var(--side);flex-shrink:0}
 .brand b{font-size:16px}#syncTxt.ok{color:#a9e0b8}#syncTxt.busy{color:#ffd08a}#syncTxt.err{color:#ffb3ba}#syncTxt{color:#a9c9b1}
 .lo{margin:0 0 0 auto;color:#fff;border-color:#ffffff55;padding:8px 12px}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:var(--side);border-top:1px solid #ffffff22;padding-bottom:env(safe-area-inset-bottom)}
 nav button{flex:1 1 0;min-width:0;text-align:center;border-left:0;border-top:3px solid transparent;padding:8px 4px 7px;font-size:12px}
 nav button .ic{display:block;width:auto;font-size:19px;line-height:1.2;margin-bottom:1px}
 nav button .fl{display:none}nav button .sh2{display:inline}
 nav button.on{border-left:0;border-top-color:var(--o)}
 main{padding:14px 12px calc(92px + env(safe-area-inset-bottom))}
 h1{font-size:21px}.top{margin-bottom:12px}
 .c4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .card{padding:14px}.card .v{font-size:22px}
 .wlayout{grid-template-columns:1fr}.wside{position:static;order:-1;padding:12px 16px}.wside .sa{font-size:28px;margin:0 0 4px}
 .srs{display:flex;gap:6px 22px;flex-wrap:wrap}.srs .sr{border:0;padding:2px 0;gap:8px}.wside .btn{margin-top:0}.wside div[style]{margin-top:8px!important}
 .tools{width:100%}.tools>*{flex:1 1 140px;min-width:0!important;width:100%!important}
 .btn{min-height:44px}.btn.sm{min-height:40px;padding:9px 13px}.big-btn{flex:1 1 140px}
 .entry .acts .btn{flex:1 1 70px}.fg{padding:14px}
}
@media(max-width:480px){.form,.set{grid-template-columns:1fr}.f.full{grid-column:auto}.form.two{grid-template-columns:1fr 1fr}}
@media print{@page{size:A4;margin:14mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{background:#fff;color:#000}.app,#boot,#login,#imgBox{display:none!important}#printReport{display:block}
 th,td{font-size:11pt;padding:5px 8px}thead{display:table-header-group}tr{page-break-inside:avoid}h2.sec{font-size:13pt;page-break-after:avoid}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="lg">W</div><div class="bt"><b id="pName">Wahidiya Press</b><small id="syncTxt" class="busy">লোড হচ্ছে…</small></div><button class="lo" id="logoutBtn" type="button">লগআউট</button></div>
  <nav id="nav">
    <button data-view="work"><span class="ic">✍️</span><span class="fl">দৈনিক এন্ট্রি</span><span class="sh2">এন্ট্রি</span></button>
    <button data-view="month"><span class="ic">📅</span><span class="fl">মাসিক রিপোর্ট</span><span class="sh2">রিপোর্ট</span></button>
    <button data-view="cust"><span class="ic">👥</span><span class="fl">কাস্টমার</span><span class="sh2">কাস্টমার</span></button>
    <button data-view="set"><span class="ic">⚙️</span><span class="fl">সেটিংস</span><span class="sh2">সেটিংস</span></button>
  </nav>
</aside>
<main>

<section id="v-work">
  <div class="top"><h1>দৈনিক ভাঁজ এন্ট্রি</h1></div>
  <div class="wlayout">
    <div>
      <form id="wForm" novalidate>
        <div class="fg"><h3 class="fh" id="wTitle">নতুন এন্ট্রি</h3><div class="form">
          <div class="f"><label for="wDate">তারিখ</label><input id="wDate" type="date"></div>
          <div class="f"><label for="wCust">কার (কাস্টমার)</label><select id="wCust"></select></div>
          <div class="f full"><label for="wBook">কোন বই</label><input id="wBook" list="bookList" placeholder="বইয়ের নাম লিখুন" autocomplete="off"><datalist id="bookList"></datalist></div>
          <div class="f"><label for="wCount">কতগুলো ভাঁজ</label><input id="wCount" class="big-in" inputmode="decimal" autocomplete="off" placeholder="0"></div>
          <div class="f"><label for="wVal">ভাঁজের মূল্য <span class="hint">(টাকা)</span></label><input id="wVal" class="big-in" inputmode="decimal" autocomplete="off" placeholder="0"></div>
        </div>
        <div class="acts"><button class="btn big-btn" type="submit" id="wSave">এন্ট্রি সেভ করুন</button><button class="btn sec big-btn" type="button" id="wClear">নতুন এন্ট্রি</button></div>
        <div class="st" id="wSt" role="status"></div></div>
      </form>
      <h2 id="wListH">এই তারিখের এন্ট্রি</h2>
      <div id="wList"></div>
    </div>
    <aside class="wside" aria-live="polite"><div id="wSum"></div></aside>
  </div>
</section>

<section id="v-month" hidden>
  <div class="top"><h1>মাসিক রিপোর্ট</h1><div class="tools"><input id="mMonth" type="month"><button class="btn" type="button" id="printMonth">🖨️ রিপোর্ট প্রিন্ট</button></div></div>
  <div class="row c4" id="mCards"></div>
  <div id="mBody"></div>
</section>

<section id="v-cust" hidden>
  <div class="top"><h1>কাস্টমার</h1></div>
  <div class="card plain"><h2 id="cTitle">নতুন কাস্টমার</h2><form id="cForm" novalidate><div class="form">
    <div class="f"><label for="cName">নাম</label><input id="cName" placeholder="কাস্টমারের নাম"></div>
    <div class="f"><label for="cPhone">মোবাইল <span class="hint">(ঐচ্ছিক)</span></label><input id="cPhone" inputmode="tel" placeholder="01XXXXXXXXX"></div></div>
    <div class="acts"><button class="btn" type="submit" id="cSave">কাস্টমার সেভ করুন</button><button class="btn sec" type="button" id="cClear">নতুন</button></div><div class="st" id="cSt" role="status"></div></form></div>
  <div id="cList"></div>
</section>

<section id="v-set" hidden>
  <div class="top"><h1>সেটিংস</h1></div>
  <div class="card plain"><h2>প্রেসের তথ্য <span class="hint">(সামারি ছবি ও রিপোর্টের মাথায় যাবে)</span></h2><div class="set">
    <div class="f"><label for="sName">প্রেসের নাম</label><input id="sName"></div>
    <div class="f"><label for="sCur">টাকার চিহ্ন</label><input id="sCur" maxlength="4"></div>
    <div class="f"><label for="sPhone">মোবাইল</label><input id="sPhone"></div>
    <div class="f"><label for="sAddr">ঠিকানা</label><input id="sAddr"></div></div></div>
  <div class="card plain"><h2>ডেটা ব্যবস্থাপনা</h2>
    <div class="acts" style="margin-top:0"><button class="btn sec" id="exportBtn">ব্যাকআপ নিন</button><button class="btn sec" id="importBtn">ব্যাকআপ ফেরত আনুন</button><button class="btn dg" id="wipeBtn">সব ডেটা মুছুন</button></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden><div class="st" id="setSt"></div></div>
</section>

</main>
</div>
<section id="printReport"></section>
<div id="imgBox" hidden><div class="ibox"><img id="imgPrev" alt="দৈনিক সামারি"><div class="acts"><button class="btn or" type="button" id="imgShare">হোয়াটসঅ্যাপে পাঠান</button><button class="btn sec" type="button" id="imgDl">ডাউনলোড</button><button class="btn sec" type="button" id="imgClose">বন্ধ করুন</button></div><div class="st" id="imgSt" role="status"></div></div></div>
<div id="boot">লোড হচ্ছে…</div>
<div id="login" hidden><form id="loginForm"><div class="lg2">W</div><h2>Wahidiya Press</h2><p>পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
  <input id="lpw" type="password" autocomplete="current-password" placeholder="পাসওয়ার্ড" required>
  <button class="btn" type="submit" id="lbtn">প্রবেশ করুন</button><div class="st" id="lst" role="alert"></div></form></div>

<script>
const $=id=>document.getElementById(id);
const WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
/* inv / pay / exp ও rates এখন আর দেখানো হয় না, কিন্তু আগের ডেটা সার্ভারে অক্ষত রাখতে এখানে লোড ও সিঙ্ক হয় */
let DB={work:[],cust:[],inv:[],pay:[],exp:[],seq:0};
let rates={};
let S={name:'Wahidiya Press',cur:'৳',phone:'',addr:''};

/* ===== server sync (Vercel API + Neon) ===== */
const KINDS=['work','cust','inv','pay','exp'];
const API=(path,opt={})=>fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});
let snap={},dirty=false,syncing=false,retryT=null,debT=null,booted=false;
function collect(){const m={};KINDS.forEach(k=>DB[k].forEach(r=>{m[k+'|'+r.id]=JSON.stringify(r)}));m['cfg|settings']=JSON.stringify(S);m['cfg|rates']=JSON.stringify(rates);m['meta|seq']=JSON.stringify({n:DB.seq});return m}
function setSync(st){const t=$('syncTxt');if(!t)return;t.className=st;t.textContent={ok:'সেভ হয়েছে ✓',busy:'সেভ হচ্ছে…',err:'সংযোগ নেই, আবার চেষ্টা হচ্ছে…'}[st]||''}
function persist(){dirty=true;setSync('busy');clearTimeout(debT);debT=setTimeout(flush,300)}
async function flush(){
  if(syncing)return;syncing=true;clearTimeout(retryT);
  try{
    while(dirty){
      dirty=false;const cur=collect(),ch=[];
      for(const k in cur){if(snap[k]!==cur[k]){const i=k.indexOf('|');ch.push({kind:k.slice(0,i),id:k.slice(i+1),data:JSON.parse(cur[k])})}}
      for(const k in snap){if(!(k in cur)){const i=k.indexOf('|');ch.push({kind:k.slice(0,i),id:k.slice(i+1),del:true})}}
      for(let i=0;i<ch.length;i+=200){
        const part=ch.slice(i,i+200);
        const r=await API('/api/sync',{method:'POST',body:JSON.stringify({changes:part})});
        if(r.status===401){dirty=true;showLogin();return}
        if(!r.ok)throw new Error('sync '+r.status);
        part.forEach(c=>{const k=c.kind+'|'+c.id;if(c.del)delete snap[k];else snap[k]=cur[k]});
      }
    }
    setSync('ok');
  }catch(e){dirty=true;setSync('err');retryT=setTimeout(flush,5000)}
  finally{syncing=false}
}
function showLogin(){$('boot').hidden=true;$('login').hidden=false;setTimeout(()=>$('lpw').focus(),50)}
async function boot(){
  $('boot').hidden=false;$('boot').textContent='লোড হচ্ছে…';
  let r;try{r=await API('/api/data')}catch(e){$('boot').textContent='সার্ভারে সংযোগ করা যাচ্ছে না। ইন্টারনেট দেখে পেজ রিফ্রেশ করুন।';return}
  if(r.status===401){showLogin();return}
  if(!r.ok){let j={};try{j=await r.json()}catch(_){}$('boot').textContent='ডেটা লোড করা যায়নি। '+(j.problems?j.problems.join(', ')+'। Vercel-এ Environment Variable দিয়ে Redeploy করুন।':j.detail?'ডেটাবেস ত্রুটি: '+j.detail:'কোড '+r.status+'। কিছুক্ষণ পরে আবার চেষ্টা করুন।');return}

const FF='"Noto Sans Bengali","Hind Siliguri","Nirmala UI","Vrinda","Kalpurush",system-ui,sans-serif';
function graphemes(w){return window.Intl&&Intl.Segmenter?[...new Intl.Segmenter('bn',{granularity:'grapheme'}).segment(w)].map(s=>s.segment):Array.from(w)}
function wrapText(ctx,text,maxW,maxLines){
  const words=String(text||'').split(/\s+/).filter(Boolean),lines=[];let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width<=maxW){cur=t;continue}
    if(cur){lines.push(cur);cur=''}
    if(ctx.measureText(w).width<=maxW){cur=w}
    else{let part='';for(const ch of graphemes(w)){if(part&&ctx.measureText(part+ch).width>maxW){lines.push(part);part=ch}else part+=ch}cur=part}
  }
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines.length=maxLines;let last=lines[maxLines-1];while(last&&ctx.measureText(last+'…').width>maxW)last=last.slice(0,-1);lines[maxLines-1]=last+'…'}
  return lines.length?lines:[''];
}
function summaryCanvas(dt){
  const L=dayEntries(dt),T=tot(L),W=1080,P=48,CW=W-2*P;
  const cols=[{k:'#',w:64,a:'c'},{k:'কাস্টমার',w:250},{k:'বইয়ের নাম',w:380},{k:'ভাঁজ',w:140,a:'r'},{k:'মূল্য',w:150,a:'r'}];
  const m=document.createElement('canvas').getContext('2d');m.font='500 28px '+FF;
  const rows=L.map((w,i)=>{const c=wrapText(m,custName(w),cols[1].w-24,2),b=wrapText(m,w.book||'নামহীন',cols[2].w-24,2);return{w,i,c,b,h:Math.max(c.length,b.length)*38+28}});
  const headH=236,tileH=136,tblH=64,totH=88,footH=84,gap=20;
  const H=headH+34+tileH+34+tblH+sum(rows,r=>r.h)+totH+footH;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.textBaseline='alphabetic';
  const rr=(a,b,c,d,r,fill)=>{x.beginPath();if(x.roundRect)x.roundRect(a,b,c,d,r);else x.rect(a,b,c,d);x.fillStyle=fill;x.fill()};
  const fit=(t,wt,sz,maxW)=>{let s=sz;do{x.font=wt+' '+s+'px '+FF;s-=2}while(x.measureText(t).width>maxW&&s>14)};
  x.fillStyle='#f4f6f3';x.fillRect(0,0,W,H);
  x.fillStyle='#14401f';x.fillRect(0,0,W,headH);x.fillStyle='#f26a2e';x.fillRect(0,headH,W,8);
  x.fillStyle='#fff';fit(S.name||'Wahidiya Press','800',58,CW);x.fillText(S.name||'Wahidiya Press',P,96);
  x.fillStyle='#ffb98f';x.font='600 34px '+FF;x.fillText('দৈনিক ভাঁজ সামারি',P,152);
  x.fillStyle='#e8f2ea';x.font='500 32px '+FF;x.fillText(wdOf(dt)+' · '+fd(dt),P,204);
  /* tiles */
  const tw=(CW-2*gap)/3,ty=headH+8+34;
  [['মোট ভাঁজ',bn(T.fold),'#14401f'],['মোট মূল্য',money(T.val),'#f26a2e'],['এন্ট্রি',bn(T.n)+'টি','#1f7a43']].forEach((t,i)=>{
    const tx=P+i*(tw+gap);rr(tx,ty,tw,tileH,14,'#fff');x.fillStyle=t[2];x.fillRect(tx,ty,tw,6);
    x.fillStyle='#667068';x.font='500 26px '+FF;x.fillText(t[0],tx+24,ty+52);
    x.fillStyle=t[2];fit(t[1],'800',54,tw-48);x.fillText(t[1],tx+24,ty+112)});
  /* table */
  let y=ty+tileH+34;rr(P,y,CW,tblH,10,'#14401f');
  let cx=P;cols.forEach(c=>{x.fillStyle='#fff';x.font='700 26px '+FF;x.textAlign=c.a==='r'?'right':c.a==='c'?'center':'left';
    x.fillText(c.k,c.a==='r'?cx+c.w-16:c.a==='c'?cx+c.w/2:cx+16,y+42);cx+=c.w});
  x.textAlign='left';y+=tblH;
  rows.forEach(r=>{
    x.fillStyle=r.i%2?'#f1f6f1':'#fff';x.fillRect(P,y,CW,r.h);x.fillStyle='#e3e8e2';x.fillRect(P,y+r.h-1,CW,1);
    const mid=y+r.h/2+10;let px=P;
    x.fillStyle='#667068';x.font='500 26px '+FF;x.textAlign='center';x.fillText(bn(r.i+1),px+cols[0].w/2,mid);px+=cols[0].w;
    x.textAlign='left';x.fillStyle='#17301f';x.font='500 28px '+FF;
    r.c.forEach((l,li)=>x.fillText(l,px+16,y+14+28+li*38));px+=cols[1].w;
    x.font='600 28px '+FF;r.b.forEach((l,li)=>x.fillText(l,px+16,y+14+28+li*38));px+=cols[2].w;
    x.textAlign='right';x.font='700 28px '+FF;x.fillText(bn(fo(r.w)),px+cols[3].w-16,mid);px+=cols[3].w;
    x.fillStyle='#1f7a43';x.fillText(bn(val(r.w)),px+cols[4].w-16,mid);x.textAlign='left';y+=r.h});
  /* total row */
  rr(P,y,CW,totH,10,'#14401f');x.fillStyle='#fff';x.font='800 32px '+FF;x.fillText('মোট',P+24,y+56);
  x.textAlign='right';x.fillText(bn(T.fold),P+cols[0].w+cols[1].w+cols[2].w+cols[3].w-16,y+56);
  x.fillStyle='#f0d878';x.fillText(money(T.val),P+CW-16,y+56);x.textAlign='center';
  x.fillStyle='#667068';x.font='500 24px '+FF;x.fillText([S.name,S.phone].filter(Boolean).join(' · '),W/2,y+totH+48);x.textAlign='left';
  return cv;
}

}
const card=(c,l,v)=>`<div class="card ${c}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
const days=L=>new Set(L.map(w=>w.date)).size;
function renderMonth(){
  if(!$('mMonth').value)$('mMonth').value=ymd(new Date()).slice(0,7);
  const m=$('mMonth').value,L=monthList(m),T=tot(L);
  $('mCards').innerHTML=card('o','মোট ভাঁজ',bn(T.fold))+card('','মোট মূল্য',money(T.val))+card('d','কাজের দিন',bn(days(L)))+card('y','এন্ট্রি',bn(T.n)+'টি');
  $('mBody').innerHTML=L.length?custTable(L)+dayTable(L):'<div class="card plain empty">এই মাসে কোনো এন্ট্রি নেই।</div>';
}
$('mMonth').addEventListener('change',renderMonth);
$('printMonth').addEventListener('click',()=>{
  const m=$('mMonth').value||ymd(new Date()).slice(0,7),L=monthList(m);
  if(!L.length){alert('এই মাসে কোনো এন্ট্রি নেই।');return}
  const T=tot(L);
  printHTML(head('মাসিক ভাঁজ রিপোর্ট – '+mName(m))
    +`<table style="margin-bottom:6px"><tr><th>কাজের দিন</th><th>এন্ট্রি</th><th>মোট ভাঁজ</th><th>মোট মূল্য</th></tr><tr><td>${bn(days(L))} দিন</td><td>${bn(T.n)}টি</td><td><b>${bn(T.fold)}</b></td><td><b>${money(T.val)}</b></td></tr></table>`
    +custTable(L)+dayTable(L)+`<div class="sign"><div>প্রস্তুতকারী</div><div>কর্তৃপক্ষের স্বাক্ষর</div></div><p style="text-align:center;color:#667068;font-size:10pt;margin-top:14px">প্রিন্টের তারিখ: ${fd(ymd(new Date()))}</p>`);
});

/* ===== customers ===== */
let editC=null;
function cReset(){editC=null;$('cForm').reset();$('cTitle').textContent='নতুন কাস্টমার';$('cSave').textContent='কাস্টমার সেভ করুন'}
$('cClear').addEventListener('click',()=>{cReset();say('cSt','')});
$('cForm').addEventListener('submit',e=>{e.preventDefault();const d={name:$('cName').value.trim(),phone:$('cPhone').value.trim()};
  if(!d.name){say('cSt','কাস্টমারের নাম লিখুন।',1);return}
  if(editC)Object.assign(editC,d);else DB.cust.push({id:uid(),address:'',open:'',...d});persist();cReset();fillCust();renderCust();say('cSt','কাস্টমার সেভ হয়েছে।')});
function renderCust(){
  const m=ymd(new Date()).slice(0,7),ml=monthList(m);
  const L=DB.cust.slice().sort((a,b)=>a.name.localeCompare(b.name,'bn'));
  $('cList').innerHTML=L.length?L.map(c=>{const t=tot(ml.filter(w=>w.cust===c.id)),used=DB.work.some(w=>w.cust===c.id)||DB.inv.some(i=>i.cust===c.id)||DB.pay.some(p=>p.cust===c.id);
    return `<article class="entry"><div class="er"><div><h3>${safe(c.name)}</h3><div class="meta">${safe(c.phone||'')}</div></div><div class="en"><span class="meta">এই মাসে</span><b>${bn(t.fold)} ভাঁজ</b><span class="bill">${money(t.val)}</span></div></div>
    <div class="acts"><button class="btn sec sm" data-c="edit" data-id="${c.id}">এডিট</button>${used?'':`<button class="btn dg sm" data-c="del" data-id="${c.id}">ডিলিট</button>`}</div></article>`}).join(''):'<div class="empty">এখনো কোনো কাস্টমার নেই।</div>';
}
$('cList').addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(!b)return;const c=DB.cust.find(x=>x.id===b.dataset.id);if(!c)return;
  if(b.dataset.c==='edit'){editC=c;$('cName').value=c.name;$('cPhone').value=c.phone||'';$('cTitle').textContent='কাস্টমার এডিট';$('cSave').textContent='পরিবর্তন সেভ করুন';$('cName').focus();window.scrollTo(0,0)}
  if(b.dataset.c==='del'&&confirm('কাস্টমার ডিলিট করবেন?')){DB.cust=DB.cust.filter(x=>x.id!==c.id);persist();fillCust();renderCust()}});

/* ===== settings ===== */
const SM={sName:'name',sCur:'cur',sPhone:'phone',sAddr:'addr'};
function applyS(){$('pName').textContent=S.name||'Press';document.title=(S.name||'Press')+' – ভাঁজ হিসাব'}
function initSettings(){Object.entries(SM).forEach(([id,k])=>{$(id).value=S[k]??'';$(id).addEventListener('input',()=>{S[k]=$(id).value.trim();if(k==='name'&&!S.name)S.name='Wahidiya Press';persist();applyS()})})}
$('exportBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({db:DB,rates,settings:S},null,1)],{type:'application/json'}));a.download='wahidiya-backup-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text()),src=d.db||{work:d.records||[]};
    KINDS.forEach(k=>{const ids=new Set(DB[k].map(r=>r.id));(src[k]||[]).forEach(r=>{if(r&&r.id&&!ids.has(r.id))DB[k].push(k==='work'&&r.cust===undefined?{...r,cust:'',inv:null}:r)})});
    DB.seq=Math.max(DB.seq,src.seq||0);persist();fillCust();renderDay();say('setSt','ব্যাকআপ ফেরত আনা হয়েছে।')}catch(_){say('setSt','ব্যাকআপ ফাইলটি পড়া যায়নি।',1)}e.target.value=''});
$('wipeBtn').addEventListener('click',()=>{if(confirm('সব এন্ট্রি ও কাস্টমার (আগের বিল/জমা/খরচসহ) মুছে যাবে। ব্যাকআপ নিয়েছেন তো?')&&confirm('নিশ্চিত? এটি আর ফেরানো যাবে না।')){DB={work:[],cust:[],inv:[],pay:[],exp:[],seq:0};persist();fillCust();renderDay();say('setSt','সব ডেটা মুছে ফেলা হয়েছে।')}});

/* ===== init ===== */
boot();
</script>
</body>
</html>
